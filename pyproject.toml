[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-audio"
version = "0.2.0"
description = "Audio-only wind-turbine anomaly detection and human-review prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]
keywords = ["audio", "anomaly-detection", "wind-turbine", "signal-processing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3,<2"]
# The project uses XGBClassifier, which also requires scikit-learn.
xgboost = ["xgboost>=2,<4", "scikit-learn>=1.3,<2"]
dev = ["build>=1.2,<2", "ruff>=0.9,<1"]

[project.scripts]
wind-audio = "wind_audio.cli:main"

[tool.setuptools.packages.find]
include = ["wind_audio", "wind_audio.*"]
exclude = ["tests*", "backup*"]

[tool.setuptools]
include-package-data = false

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["backup", "data", "models", "cache", "runs", "outputs", "reports"]

[tool.ruff.lint]
# Start with correctness checks without reformatting the entire prototype.
select = ["E9", "F63", "F7", "F82"]
