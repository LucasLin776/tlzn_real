[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-audio"
version = "0.11.0"
description = "Normal-only audio anomaly learning, spectral windows and reviewed PANNs classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.6,<3", "matplotlib>=3.8,<4", "reportlab>=4,<5"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "ruff>=0.9,<1"]

[project.scripts]
wind-audio = "wind_audio.cli:main"

[tool.setuptools.packages.find]
include = ["wind_audio", "wind_audio.*"]

[tool.setuptools]
include-package-data = false

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["backup", "data", "models", "cache", "runs", "outputs", "reports"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
