name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} / ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            backend: core
            install: '.'
          - python: '3.12'
            backend: sklearn
            install: '.[sklearn]'
          - python: '3.12'
            backend: xgboost
            install: '.[xgboost]'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install '${{ matrix.install }}'
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -t . -v
      - name: Installed command smoke test
        run: wind-audio --help

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development tools
        run: python -m pip install '.[dev]'
      - name: Static correctness checks
        run: python -m ruff check wind_audio tests
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify distribution excludes local data
        run: python scripts/check_distribution.py dist
